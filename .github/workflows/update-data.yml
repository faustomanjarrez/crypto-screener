name: Actualizar datos y publicar app

on:
  push:
    branches: [main]
  schedule:
    # Todos los días, 06:30 UTC (crypto opera 24/7)
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crypto-pipeline
  cancel-in-progress: false

jobs:
  # Corre el screener (~1-2 min) — solo en corridas programadas o manuales
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Solo librería estándar de Python — sin dependencias
      - name: Correr screener crypto
        run: python fetch_crypto.py

      - name: Guardar datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.js crypto_screen.json history.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos — nada que publicar"
          else
            git commit -m "📊 Datos actualizados $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi

  # Publica la carpeta app/ en GitHub Pages
  deploy:
    needs: update-data
    if: always() && !cancelled() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
